# 敏感信息请勿写在本文件中，请通过环境变量或 application-local.yml（已加入 .gitignore）提供。
spring:
  config:
    import: optional:classpath:application-local.yml
  application:
    name: hhh-campus-mind
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  # ===== Elasticsearch =====
  elasticsearch:
    uris: http://localhost:9201

  # ===== Redis =====
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 1
          max-wait: 1000ms

  # ===== PostgreSQL 数据源 =====
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:campus_mind}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000


  # === RabbitMQ ===
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: ${SERVER_PORT:8080}

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: cn.hhh.campusmind
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ===== 阿里云 OSS（与 application-local.yml 中 hhh-campus-mind.alioss 字段一致；密钥勿提交）=====
hhh-campus-mind:
  alioss:
    bucket-name: ${ALIOSS_BUCKET_NAME}
    access-key-id: ${ALIOSS_ACCESS_KEY_ID}
    access-key-secret: ${ALIOSS_ACCESS_KEY_SECRET}
    endpoint: ${ALIOSS_ENDPOINT}

  sts:
    access-key-id: ${STS_ACCESS_KEY_ID}
    access-key-secret: ${STS_ACCESS_KEY_SECRET}
    role-arn: ${STS_ROLE_ARN}

